site_name: AMA Office Standards
site_description: Drawing and documentation protocols for Aaron Maret Architect.
site_url: https://standards.aaronmaret.com/
repo_url: https://github.com/aaronmaret/ama-office-standards
repo_name: AMA / Office Standards
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  font: false
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.top
  - search.suggest
  - search.highlight
  - content.action.edit
plugins:
- search
markdown_extensions:
- tables
- admonition
- toc:
    permalink: true
extra_css:
- stylesheets/brand.css
nav:
- Overview: index.md
